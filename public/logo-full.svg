<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 480" width="100%" height="100%">
  <!-- Icon Mark Square -->
  <rect x="25" y="25" width="430" height="430" rx="36" fill="#C93D51" />
  <path d="M 93 256 C 129 210 195 138 249 144 C 279 148 277 180 263 234 C 310 182 380 134 427 142 C 463 148 479 185 460 220 C 437 262 380 254 347 222 C 311 188 283 204 259 252 C 230 310 187 392 165 392 C 153 392 151 378 161 344 C 180 282 241 185 239 168 C 237 158 223 160 203 176 C 165 206 117 258 99 272 C 89 278 87 264 93 256 Z" fill="#FFFFFF" />

  <!-- Typography: Roots & Routes Foundation in elegant Didone / Garamond serif style -->
  <g fill="#C93D51" font-family="'Cormorant Garamond', 'Playfair Display', Georgia, serif">
    <!-- Line 1: Roots -->
    <text x="500" y="150" font-size="145" font-weight="700" letter-spacing="2">Roots</text>
    
    <!-- Line 2: & Routes -->
    <text x="500" y="280" font-size="145" font-style="italic" font-weight="600" letter-spacing="1">
      <tspan font-style="italic" font-family="'Cormorant Garamond', Georgia, serif" font-weight="400">&amp;</tspan>
      <tspan font-style="normal" font-weight="600"> Routes</tspan>
    </text>
    
    <!-- Line 3: Foundation -->
    <text x="500" y="415" font-size="145" font-style="italic" font-weight="600" letter-spacing="1.5">Foundation</text>
  </g>
</svg>
